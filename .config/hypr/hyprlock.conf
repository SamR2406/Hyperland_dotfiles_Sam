# ╔══════════════════════════════════════════════════════════════╗
# ║                     hyprlock.conf                           ║
# ║              Nord Dark · Clean · Minimal                    ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Place this file at: ~/.config/hypr/hyprlock.conf
# Wallpaper path:     edit background.path below
# Font:               requires a Nerd Font (e.g. JetBrainsMono Nerd Font)
#
# Nord palette used:
#   #2E3440  bg dark       #88C0D0  frost cyan
#   #3B4252  bg mid        #81A1C1  frost blue
#   #4C566A  bg light      #5E81AC  frost navy
#   #D8DEE9  snow white    #BF616A  aurora red
# ──────────────────────────────────────────────────────────────

general {
    grace            = 0          # seconds before password is required (0 = always)
    hide_cursor      = true       # hide cursor on lockscreen
    no_fade_in       = false      # smooth fade-in
    no_fade_out      = false      # smooth fade-out
    disable_loading_bar = false   # show subtle loading bar at bottom
    ignore_empty_input = true     # don't attempt auth on empty field
}

# ── Animations ─────────────────────────────────────────────────

bezier = easeOut,  0.16, 1, 0.3, 1
bezier = easeIn,   0.7,  0, 0.84, 0
bezier = smoothIn, 0.25, 0.46, 0.45, 0.94

animations {
    enabled = true

    animation = global,        1, 8,  easeOut
    animation = fadeIn,        1, 6,  easeOut
    animation = fadeOut,       1, 4,  easeIn
    animation = inputFieldColors, 1, 3, smoothIn
    animation = inputFieldFade,   1, 3, smoothIn
    animation = inputFieldWidth,  1, 4, easeOut
    animation = inputFieldDots,   1, 2, easeOut
}

# ── Backgrounds ────────────────────────────────────────────────
# One block per monitor. Widgets below are pinned to DP-1 only.

# Primary — landscape 1920x1080 @ 144Hz
background {
    monitor  = DP-1
    path     = /home/sam/Images/monitor1.png

    blur_passes      = 3
    blur_size        = 7
    noise            = 0.0117
    contrast         = 0.8916
    brightness       = 0.7200
    vibrancy         = 0.1696
    vibrancy_darkness = 0.0
}

# Secondary — portrait rotated (transform 3), just a clean blurred bg
background {
    monitor  = DP-2
    path     = /home/sam/Images/monitor2.jpg

    blur_passes      = 4
    blur_size        = 8
    noise            = 0.0117
    contrast         = 0.8500
    brightness       = 0.6000             # slightly darker on secondary
    vibrancy         = 0.1000
    vibrancy_darkness = 0.0
}

# ── Clock — large centrepiece ──────────────────────────────────

label {
    monitor  = DP-1
    text     = $TIME
    color    = rgba(216, 222, 233, 0.92)   # nord snow-white
    font_size   = 96
    font_family = JetBrainsMono Nerd Font Bold

    shadow_passes = 3
    shadow_size   = 6
    shadow_color  = rgba(0, 0, 0, 0.40)
    shadow_boost  = 1.2

    position = 0, 160
    halign   = center
    valign   = center
}

# ── Date ───────────────────────────────────────────────────────

label {
    monitor  = DP-1
    text     = cmd[update:60000] date +"%A, %d %B %Y"
    color    = rgba(136, 192, 208, 0.85)   # nord frost-cyan
    font_size   = 22
    font_family = JetBrainsMono Nerd Font

    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = rgba(0, 0, 0, 0.35)

    position = 0, 60
    halign   = center
    valign   = center
}

# ── Greeting / username ────────────────────────────────────────

label {
    monitor  = DP-1
    text     =  $USER
    color    = rgba(216, 222, 233, 0.55)
    font_size   = 15
    font_family = JetBrainsMono Nerd Font

    position = 0, -56
    halign   = center
    valign   = center
}

# ── Password input field ───────────────────────────────────────

input-field {
    monitor  = DP-1
    size     = 280, 52

    outline_thickness = 2
    dots_size         = 0.28        # dot size relative to field height
    dots_spacing      = 0.20
    dots_center       = true
    dots_rounding     = -1          # -1 = fully round dots

    # colours — idle
    outer_color   = rgba(76,  86,  106, 0.85)   # nord bg-light border
    inner_color   = rgba(46,  52,  64,  0.75)   # nord bg-dark fill
    font_color    = rgb(216, 222, 233)           # nord snow text
    check_color   = rgb(136, 192, 208)           # frost cyan on check
    fail_color    = rgb(191,  97, 106)           # aurora red on fail

    # transition when typing
    capslock_color    = rgb(235, 203, 139)       # aurora yellow
    numlock_color     = -1                       # -1 = same as outer
    bothlock_color    = -1

    fade_on_empty    = true
    fade_timeout     = 2000          # ms before fading when empty
    placeholder_text = <span foreground="##6B7898"> password...</span>
    hide_input       = false

    rounding         = 12            # rounded corners (px, -1 = full)
    shadow_passes    = 3
    shadow_size      = 8
    shadow_color     = rgba(0, 0, 0, 0.45)
    shadow_boost     = 1.1

    fail_text        = <span foreground="##BF616A"><i>$FAIL ($ATTEMPTS)</i></span>
    fail_timeout     = 2000          # ms to show fail message

    position = 0, -30
    halign   = center
    valign   = center
}

# ── Subtle hint text at the bottom ────────────────────────────

label {
    monitor  = DP-1
    text     = press Enter to unlock
    color    = rgba(216, 222, 233, 0.20)
    font_size   = 11
    font_family = JetBrainsMono Nerd Font

    position = 0, 24
    halign   = center
    valign   = bottom
}